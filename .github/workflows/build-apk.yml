
name: Build NEON SURVIVAL APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Extract project
        run: unzip -q NEON_SURVIVAL_Android_Project (1).zip -d source

      - name: Install packages
        working-directory: source
        run: npm install

      - name: Create Android project
        working-directory: source
        run: npx cap add android

      - name: Sync Android project
        working-directory: source
        run: npx cap sync android

      - name: Build APK
        working-directory: source/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEON-SURVIVAL-APK
          path: source/android/app/build/outputs/apk/debug/app-debug.apk
